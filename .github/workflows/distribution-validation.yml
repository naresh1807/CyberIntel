name: Kali and Parrot release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - kalilinux/kali-rolling@sha256:52b0d1581162a9fe506450b83055647e9a03e86672cc589467b235b69f585699
          - parrotsec/core@sha256:7ac3f98c41fd0adf68a3c8ee2b3b69cc4c26335e8df3125b0c33a3928c08a7e2
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      CYBERRECON_TEST_IMAGE: ${{ matrix.image }}
    steps:
      - name: Install build/test dependencies in disposable distro container
        run: |
          cat /etc/os-release
          uname -a
          mkdir -p /run
          echo RELEASE_TEST_ONLY > /run/cyberrecon-disposable-root
          apt-get update
          apt-get install -y git python3 python3-venv python3-pip python3-cryptography golang-go nmap tshark apt-utils gnupg desktop-file-utils libgl1 libfontconfig1 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run source tests on distribution Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          dpkg-query -W -f='${binary:Package} ${Version}\n' libgl1 libfontconfig1
          ldconfig -p | grep -F 'libGL.so.1'
          ldconfig -p | grep -F 'libfontconfig.so.1'
          .venv/bin/python -c 'import sys, PySide6; from PySide6 import QtWidgets; print(sys.version); print("PySide6", PySide6.__version__); print("QtWidgets import: PASS")'
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/verify_cyberrecon_startup.py
          .venv/bin/python scripts/verify_cyberrecon_lab.py --tls
      - name: Go race tests
        working-directory: workers/dns
        run: go test -race ./...
      - name: Build previous and current Debian packages
        run: |
          mkdir -p /tmp/cyberrecon-prior
          git archive --output=/tmp/cyberrecon-prior.tar a173634
          tar -xf /tmp/cyberrecon-prior.tar -C /tmp/cyberrecon-prior
          python3 /tmp/cyberrecon-prior/scripts/build-cyberrecon-deb.py --output /tmp/cyberrecon-prior-dist
          python3 scripts/build-cyberrecon-deb.py --output dist/qualification
      - name: Qualify installed package lifecycle and local scan
        run: |
          python3 scripts/qualify_cyberrecon_release.py /tmp/cyberrecon-prior-dist/cyberrecon_0.2.0-4_all.deb dist/qualification/cyberrecon_0.2.0-5_all.deb
      - name: Preserve evidence even on failure
        if: always()
        run: |
          mkdir -p artifacts/qualification
          test ! -d /tmp/cyberrecon-qualification || cp -a /tmp/cyberrecon-qualification/. artifacts/qualification/
          printf '%s\n' "$CYBERRECON_TEST_IMAGE" > artifacts/qualification/image.txt
          cat /etc/os-release > artifacts/qualification/os-release.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ strategy.job-index }}
          path: artifacts/qualification
