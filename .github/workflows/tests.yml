name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark nmap apt-utils gnupg desktop-file-utils libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
      - run: go test -race ./...
        working-directory: workers/dns
      - run: |
          mkdir -p dist
          cd workers/dns
          go build -trimpath -o ../../dist/cyberrecon-dns .
      - run: python -m pytest -q
      - run: python scripts/verify_demo.py
      - run: python scripts/verify_cyberrecon_lab.py --tls
