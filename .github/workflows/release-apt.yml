name: CyberRecon protected APT release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after exact-commit desktop/VM qualification and identity/HTTPS setup
        type: boolean
        default: false
      signing_dry_run:
        description: Protected production-key signing and verification without Pages or Release publication
        type: boolean
        default: false
      refresh_only:
        description: Renew signed APT metadata without creating another GitHub release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cyberrecon-production-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: ${{ (inputs.publish || inputs.signing_dry_run) && 'cyberrecon-production' || 'cyberrecon-candidate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      CYBERRECON_MAINTAINER: ${{ vars.CYBERRECON_MAINTAINER }}
      APT_PUBLIC_URL: ${{ vars.APT_PUBLIC_URL }}
      RELEASE_QUALIFIED_COMMIT: ${{ vars.RELEASE_QUALIFIED_COMMIT }}
      RELEASE_QUALIFICATION_JSON: ${{ vars.RELEASE_QUALIFICATION_JSON }}
      PUBLISH: ${{ inputs.publish }}
      SIGNING_DRY_RUN: ${{ inputs.signing_dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.8'
      - name: Fail closed before production work
        run: |
          if [ "$PUBLISH" = true ] && [ "$SIGNING_DRY_RUN" = true ]; then
            echo 'Select publication or signing dry-run, never both.' >&2
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then
            python scripts/prepare_cyberrecon_release.py --production-gate
          fi
      - name: Install test and build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nmap tshark apt-utils gnupg desktop-file-utils libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install -r release/tools.txt
          python -m pip install -c release/constraints-python314.txt -e '.[dev]'
      - name: Test, audit and build
        run: |
          mkdir -p dist/release/evidence
          python -m pytest -q --junitxml dist/release/evidence/pytest.xml
          python scripts/verify_cyberrecon_startup.py
          python scripts/verify_cyberrecon_lab.py --tls --require-nmap
          python -m pip_audit --no-deps --disable-pip -r release/constraints-python314.txt -f json -o dist/release/evidence/dependency-audit.json
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          (cd workers/dns && go test -race ./... && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../dist/release/cyberrecon-dns .)
          python -m build --no-isolation --outdir dist/release
          if [ "$PUBLISH" = true ] || [ "$SIGNING_DRY_RUN" = true ]; then
            python scripts/build-cyberrecon-deb.py --worker dist/release/cyberrecon-dns --output dist/release --production --maintainer "$CYBERRECON_MAINTAINER"
          else
            python scripts/build-cyberrecon-deb.py --worker dist/release/cyberrecon-dns --output dist/release
          fi
          python scripts/verify_cyberrecon_package.py dist/release/cyberrecon_0.2.0-5_amd64.deb
          python scripts/check_release_security.py --artifacts dist/release
          python scripts/prepare_cyberrecon_release.py --build-manifest dist/release
          python scripts/prepare_cyberrecon_release.py --checksums dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/release
  sign:
    needs: prepare
    if: inputs.publish || inputs.signing_dry_run
    environment:
      name: cyberrecon-production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist/release
      - run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg
          cd dist/release
          sha256sum -c SHA256SUMS
      - name: Sign outside workspace with protected secrets
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          umask 077
          python3 scripts/sign_cyberrecon_release.py dist/release/cyberrecon_0.2.0-5_amd64.deb --output dist/release/apt
          unset APT_SIGNING_PRIVATE_KEY APT_SIGNING_PASSPHRASE
          python3 scripts/verify_cyberrecon_apt.py dist/release/apt --keyring dist/release/apt/cyberrecon-archive-keyring.gpg --fingerprint "$APT_SIGNING_FINGERPRINT" --production
          python3 scripts/test_cyberrecon_apt_tampering.py dist/release/apt --keyring dist/release/apt/cyberrecon-archive-keyring.gpg --fingerprint "$APT_SIGNING_FINGERPRINT" --production
          python3 scripts/check_release_security.py --artifacts dist/release
          python3 scripts/prepare_cyberrecon_release.py --checksums dist/release
      - name: Remove temporary production signing material
        if: always()
        run: |
          : "${RUNNER_TEMP:?Runner temporary directory is required}"
          for signing_directory in "$RUNNER_TEMP"/cyberrecon-production-sign-*; do
            [ -d "$signing_directory" ] && [ ! -L "$signing_directory" ] || continue
            GNUPGHOME="$signing_directory" gpgconf --kill gpg-agent || true
            rm -rf -- "$signing_directory"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: dist/release
      - if: inputs.publish
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/release/apt
  deploy:
    needs: sign
    if: inputs.publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
  publish:
    needs: deploy
    if: inputs.publish
    environment:
      name: cyberrecon-production
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: dist/release
      - name: Verify HTTPS repository, then publish notes/artifacts
        env:
          APT_PUBLIC_URL: ${{ vars.APT_PUBLIC_URL }}
          GH_TOKEN: ${{ github.token }}
          REFRESH_ONLY: ${{ inputs.refresh_only }}
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$APT_PUBLIC_URL/dists/stable/InRelease" -o "$RUNNER_TEMP/InRelease"
          gpgv --keyring "$PWD/dist/release/apt/cyberrecon-archive-keyring.gpg" "$RUNNER_TEMP/InRelease"
          cmp "$RUNNER_TEMP/InRelease" dist/release/apt/dists/stable/InRelease
          (cd dist/release && sha256sum -c SHA256SUMS)
          tar -czf dist/cyberrecon-apt.tar.gz -C dist/release/apt .
          sha256sum dist/cyberrecon-apt.tar.gz > dist/apt-tar.SHA256SUMS
          if [ "$REFRESH_ONLY" != true ]; then
            gh release create v0.2.0 --target "$GITHUB_SHA" --title 'CyberRecon v0.2.0' --notes-file docs/RELEASE_NOTES.md dist/release/*.deb dist/release/*.whl dist/release/*.tar.gz dist/release/SHA256SUMS dist/cyberrecon-apt.tar.gz dist/apt-tar.SHA256SUMS
          fi
